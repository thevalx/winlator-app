name: Winlator +trig test APK

on:
  push:
    branches: ['feat/trigger-modes']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the runner Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Install official build tool versions
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - name: Trigger regression checks
        run: python3 tests/trigger_modes/run.py
      - name: Runtime identity relocation checks
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          python3 tests/runtime_paths/run.py
      - name: Preserve test APK signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: winlator-trig-test-keystore-v1
      - name: Build APK with official runtime assets and native sources
        run: bash gradlew --no-daemon --max-workers=2 assembleDebug
      - name: Verify identity and APK signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-badging.txt
          grep -F "package: name='com.winlator.trig'" apk-badging.txt
          grep -F "application-label:'Winlator +trig'" apk-badging.txt
          cp "$APK" 'Winlator-plus-trig.apk'
          sha256sum 'Winlator-plus-trig.apk' > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Winlator-plus-trig
          path: |
            Winlator-plus-trig.apk
            SHA256SUMS.txt
            apk-badging.txt
          compression-level: 0
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Winlator-plus-trig
      - name: Publish a phone-downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          sha256sum --check SHA256SUMS.txt
          tag="trig-test-${COMMIT:0:7}"
          cat > release-notes.md <<'NOTES'
          Winlator +trig test APK for ARM64 Android. Installs as com.winlator.trig alongside official Winlator.

          Download Winlator-plus-trig.apk below directly on your phone. Axis mode is the default; Button and Both are available globally and per shortcut.

          Trigger regression checks, runtime identity checks, APK build and signature/identity verification passed in this workflow. Physical controller behavior and game FPS still require phone testing.
          NOTES
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" Winlator-plus-trig.apk SHA256SUMS.txt apk-badging.txt --repo "$REPOSITORY" --clobber
          else
            gh release create "$tag" Winlator-plus-trig.apk SHA256SUMS.txt apk-badging.txt --repo "$REPOSITORY" --target "$COMMIT" --prerelease --title "Winlator +trig test ${COMMIT:0:7}" --notes-file release-notes.md
          fi

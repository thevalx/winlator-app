name: Winlator +trig test APK

on:
  push:
    branches: ['feat/trigger-modes']
    paths-ignore:
      - '**/*.md'
      - '.github/scripts/signing_backup.py'
      - '.github/workflows/test-signing-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Preserve test APK signing key between builds
        id: signing_key
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/winlator-trig-signing
          key: winlator-trig-signing-v2
          fail-on-cache-miss: true
      - name: Verify the retained signing certificate
        shell: bash
        run: |
          keystore="$HOME/.local/share/winlator-trig-signing/debug.keystore"
          test -s "$keystore"
          keytool -exportcert -keystore "$keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1 > retained-certificate.txt
          diff .github/test-signing.sha256 retained-certificate.txt
          echo "WINLATOR_TEST_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Use the runner Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Install official build tool versions
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - name: Trigger regression checks
        run: python3 tests/trigger_modes/run.py
      - name: Runtime identity relocation checks
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          python3 tests/runtime_paths/run.py
      - name: HUD and controller menu regression checks
        run: |
          python3 tests/hud/run.py
          python3 tests/menu_binding/run.py
          python3 tests/menu_release/run.py
      - name: Android UI tests
        run: bash gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g :app:testDebugUnitTest
      - name: Build APK with official runtime assets and native sources
        run: bash gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g -Pandroid.injected.signing.store.file="$WINLATOR_TEST_KEYSTORE" -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android assembleDebug
      - name: Verify identity and APK signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > signing-certificate.txt
          fingerprint="$(cat .github/test-signing.sha256)"
          grep -F "Signer #1 certificate SHA-256 digest: $fingerprint" signing-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-badging.txt
          grep -F "package: name='com.winlator.trig'" apk-badging.txt
          grep -F "application-label:'Winlator +trig'" apk-badging.txt
          cp "$APK" 'Winlator-plus-trig.apk'
          sha256sum 'Winlator-plus-trig.apk' > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Winlator-plus-trig
          path: |
            Winlator-plus-trig.apk
            SHA256SUMS.txt
            apk-badging.txt
          compression-level: 0
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Winlator-plus-trig
      - name: Publish a phone-downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          sha256sum --check SHA256SUMS.txt
          tag="trig-test-${COMMIT:0:7}"
          cat > release-notes.md <<'NOTES'
          Winlator +trig prerelease 2 for ARM64 Android. The first release's signing key was not retained; this APK cannot update that installation directly.

          Download Winlator-plus-trig.apk below directly on your phone.

          New in prerelease 2: a dark in-game sidebar, configurable Modern HUD, and an opt-in Winlator → Open in-game menu action in existing controller profile bindings. Assign it to BUTTON MODE on your GameSir G8+ if desired; no button is captured by default.

          Trigger modes remain available globally and per shortcut. Runtime assets, renderer defaults and gamepad transport are preserved.

          Trigger regression checks, runtime identity checks, APK build and signature/identity verification passed in this workflow. Physical controller behavior and game FPS still require phone testing.
          NOTES
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" Winlator-plus-trig.apk SHA256SUMS.txt apk-badging.txt --repo "$REPOSITORY" --clobber
          else
            gh release create "$tag" Winlator-plus-trig.apk SHA256SUMS.txt apk-badging.txt --repo "$REPOSITORY" --target "$COMMIT" --prerelease --title "Winlator +trig prerelease 2 (${COMMIT:0:7})" --notes-file release-notes.md
          fi

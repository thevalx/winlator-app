apply plugin: 'com.android.application'

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.winlator.trig'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 34
        versionName "11.2+trig.2"

        externalNativeBuild {
            cmake {
                arguments "-DWINLATOR_APPLICATION_ID=${applicationId}"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'user.home', System.getProperty('user.home')
            systemProperty 'winlator.preview.dir', System.getProperty('winlator.preview.dir', '')
        }
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
}
